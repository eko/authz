version: 2

updates:
- package-ecosystem: "docker"
  directories:
    - "/"
    - "/backend"
    - "/frontend"
  schedule:
    interval: daily
    time: "05:00"
  commit-message:
    prefix: "[docker] "
  open-pull-requests-limit: 10
  groups:
    docker:
      patterns:
        - "*"
  ignore:
    # Only follow Node.js LTS (even) major versions.
    - dependency-name: "node"
      versions: ["25.x", "27.x", "29.x"]

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "05:00"
  commit-message:
    prefix: "[github-actions] "
  open-pull-requests-limit: 10
  groups:
    github_actions:
      patterns:
        - "*"

- package-ecosystem: gomod
  directory: "/backend"
  schedule:
    interval: daily
    time: "05:00"
  commit-message:
    prefix: "[gomod] "
  open-pull-requests-limit: 10
  groups:
    gomod:
      patterns:
        - "*"

- package-ecosystem: "npm"
  directory: "/frontend"
  schedule:
    interval: daily
    time: "05:00"
  commit-message:
    prefix: "[npm] "
  open-pull-requests-limit: 10
  ignore:
    # react-scripts (Create React App) does not support TypeScript 6+.
    - dependency-name: "typescript"
      versions: [">=6"]
  groups:
    npm:
      patterns:
        - "*"
