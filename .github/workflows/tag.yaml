name: Test/Build/Push (tag)

on:
  push:
    tags:
      # Only release tags: Go module tags (backend/v*, sdk/v*) must not trigger a release.
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          cd backend
          go test -v -cover -race ./...

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: standalone
            context: .
            file: Dockerfile.standalone
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ekofr/authz:${{ github.ref_name }}-${{ matrix.name }}

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          cd backend
          for target in linux/386 linux/amd64 linux/arm darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -ldflags "-s -w" -o "dist/authz-${target%/*}-${target#*/}" ./cmd
          done

      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes backend/dist/*
