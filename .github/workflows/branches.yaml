name: Backend

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
          args: --build-tags functional

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Run Go tests
        run: |
          cd backend
          go test -race -count=1 -v ./...

  backend-functional-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: isbang/compose-action@cdaf49f2d715a87c3387e86cb35c772b14f0efe0 # v3.2.1
        with:
          compose-file: "./docker-compose.postgres.yaml"

      - name: Run Godog tests
        env:
          AUTH_JWT_SIGN_STRING: "functional-tests-signing-secret-0123456789"
        run: |
          cd backend
          go test -count=1 --tags=functional -v ./functional \
            --godog.format=pretty,junit:${{ github.workspace }}/backend/godog-report.xml

      - name: Upload Godog report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godog-report
          path: backend/godog-report.xml
          if-no-files-found: ignore

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Run tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  sdk-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: sdk
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: sdk/fiber

  sdk-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Run Go tests
        run: |
          cd sdk
          go test -race -count=1 -v ./...
      - name: Run Go tests (fiber middleware)
        run: |
          cd sdk/fiber
          go test -race -count=1 -v ./...
